

<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Globaler Echtzeit-Chat</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Angepasste Scrollbar für ein schöneres Design */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #f1f1f1; 
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb {
            background: #cbd5e1; 
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #94a3b8; 
        }
        
        .message-enter {
            animation: fadeIn 0.3s ease-out forwards;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body class="bg-slate-100 h-screen flex flex-col font-sans antialiased text-slate-800">

    <!-- Ladebildschirm -->
    <div id="loading-screen" class="absolute inset-0 flex flex-col items-center justify-center bg-slate-100 z-50">
        <div class="animate-spin rounded-full h-12 w-12 border-b-2 border-indigo-600 mb-4"></div>
        <p class="text-slate-500 font-medium">Verbinde mit dem Chat-Server...</p>
    </div>

    <!-- Namenswahl-Bildschirm (Login) -->
    <div id="login-screen" class="hidden absolute inset-0 flex items-center justify-center bg-slate-100 z-40 p-4">
        <div class="bg-white p-8 rounded-2xl shadow-xl w-full max-w-md text-center">
            <div class="w-16 h-16 bg-indigo-100 text-indigo-600 rounded-full flex items-center justify-center mx-auto mb-4">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 24 24" stroke-width="1.5" stroke="currentColor" class="w-8 h-8">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M7.5 8.25h9m-9 3H12m-9.75 1.51c0 1.6 1.123 2.994 2.707 3.227 1.129.166 2.27.293 3.423.379.35.026.67.21.865.501L12 21l2.755-4.133a1.14 1.14 0 01.865-.501 48.172 48.172 0 003.423-.379c1.584-.233 2.707-1.626 2.707-3.228V6.741c0-1.602-1.123-2.995-2.707-3.228A48.394 48.394 0 0012 3c-2.392 0-4.744.175-7.043.513C3.373 3.746 2.25 5.14 2.25 6.741v6.018z" />
                </svg>
            </div>
            <h1 class="text-2xl font-bold text-slate-800 mb-2">Willkommen im Chat!</h1>
            <p class="text-slate-500 mb-6">Wähle einen Namen, mit dem du am Chat teilnehmen möchtest.</p>
            
            <form id="join-form" class="space-y-4">
                <div>
                    <input type="text" id="username-input" required placeholder="Dein Chat-Name" class="w-full px-4 py-3 border border-slate-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent transition-all" autocomplete="off" maxlength="20">
                </div>
                <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-3 px-4 rounded-xl transition-colors flex justify-center items-center">
                    Chat beitreten
                </button>
            </form>
            <div id="login-error" class="text-red-500 text-sm mt-4 hidden"></div>
        </div>
    </div>

    <!-- Haupt-Chatbereich -->
    <div id="chat-screen" class="hidden flex-col h-full max-w-4xl mx-auto w-full bg-white shadow-2xl relative">
        
        <!-- Chat Header -->
        <header class="bg-indigo-600 text-white px-6 py-4 flex justify-between items-center shrink-0 shadow-md z-10 relative">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 bg-white/20 rounded-full flex items-center justify-center">
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 24 24" stroke-width="1.5" stroke="currentColor" class="w-6 h-6">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M15 19.128a9.38 9.38 0 002.625.372 9.337 9.337 0 004.121-.952 4.125 4.125 0 00-7.533-2.493M15 19.128v-.003c0-1.113-.285-2.16-.786-3.07M15 19.128v.106A12.318 12.318 0 018.624 21c-2.331 0-4.512-.645-6.374-1.766l-.001-.109a6.375 6.375 0 0111.964-3.07M12 6.375a3.375 3.375 0 11-6.75 0 3.375 3.375 0 016.75 0zm8.25 2.25a2.625 2.625 0 11-5.25 0 2.625 2.625 0 015.25 0z" />
                    </svg>
                </div>
                <div>
                    <h2 class="font-bold text-lg">Öffentlicher Raum</h2>
                    <p class="text-xs text-indigo-200">Du bist verbunden als: <span id="display-name" class="font-semibold text-white"></span></p>
                </div>
            </div>
            <button id="logout-btn" class="text-sm bg-indigo-700 hover:bg-indigo-800 px-3 py-1.5 rounded-lg transition-colors">
                Namen ändern
            </button>
        </header>

        <!-- Nachrichtenbereich -->
        <main id="chat-messages" class="flex-1 overflow-y-auto p-6 space-y-4 bg-slate-50 relative">
            <!-- Nachrichten werden hier per JS eingefügt -->
            <div id="empty-state" class="absolute inset-0 flex flex-col items-center justify-center text-slate-400 hidden">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 24 24" stroke-width="1.5" stroke="currentColor" class="w-12 h-12 mb-3 opacity-50">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M7.5 8.25h9m-9 3H12m-9.75 1.51c0 1.6 1.123 2.994 2.707 3.227 1.129.166 2.27.293 3.423.379.35.026.67.21.865.501L12 21l2.755-4.133a1.14 1.14 0 01.865-.501 48.172 48.172 0 003.423-.379c1.584-.233 2.707-1.626 2.707-3.228V6.741c0-1.602-1.123-2.995-2.707-3.228A48.394 48.394 0 0012 3c-2.392 0-4.744.175-7.043.513C3.373 3.746 2.25 5.14 2.25 6.741v6.018z" />
                </svg>
                <p>Noch keine Nachrichten. Schreib die Erste!</p>
            </div>
        </main>

        <!-- Eingabebereich -->
        <footer class="p-4 bg-white border-t border-slate-200 shrink-0">
            <form id="message-form" class="flex gap-2 relative">
                <input type="text" id="message-input" autocomplete="off" placeholder="Schreibe eine Nachricht..." class="flex-1 px-4 py-3 bg-slate-100 border-transparent rounded-full focus:bg-white focus:ring-2 focus:ring-indigo-500 focus:border-transparent transition-all outline-none">
                <button type="submit" id="send-btn" class="bg-indigo-600 hover:bg-indigo-700 text-white rounded-full w-12 h-12 flex items-center justify-center shrink-0 transition-colors disabled:opacity-50 disabled:cursor-not-allowed">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" class="w-5 h-5 ml-1">
                        <path d="M3.478 2.404a.75.75 0 00-.926.941l2.432 7.905H13.5a.75.75 0 010 1.5H4.984l-2.432 7.905a.75.75 0 00.926.94 60.519 60.519 0 0018.445-8.986.75.75 0 000-1.218A60.517 60.517 0 003.478 2.404z" />
                    </svg>
                </button>
            </form>
        </footer>
    </div>

    <!-- Firebase SDK (ES Modules) -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInWithCustomToken, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, onSnapshot, addDoc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        const firebaseConfig = typeof __firebase_config !== 'undefined' ? JSON.parse(__firebase_config) : {};
        
        // WICHTIGE ÄNDERUNG: Wir ignorieren die generierte __app_id und zwingen
        // alle Nutzer, die diesen Code ausführen, denselben fixen "Raum-Namen" zu benutzen.
        const appId = "gemeinsamer_chat_raum_12345"; 
        
        let app, auth, db;
        try {
            app = initializeApp(firebaseConfig);
            auth = getAuth(app);
            db = getFirestore(app);
        } catch (error) {
            console.error("Firebase konnte nicht initialisiert werden:", error);
            showError("Fehler bei der Datenbankverbindung.");
        }

        // Globale Variablen
        let currentUser = null;
        let currentUsername = "";
        let unsubscribeMessages = null;

        // UI Elemente referenzieren
        const loadingScreen = document.getElementById('loading-screen');
        const loginScreen = document.getElementById('login-screen');
        const chatScreen = document.getElementById('chat-screen');
        const joinForm = document.getElementById('join-form');
        const usernameInput = document.getElementById('username-input');
        const displayNameEl = document.getElementById('display-name');
        const messageForm = document.getElementById('message-form');
        const messageInput = document.getElementById('message-input');
        const chatMessages = document.getElementById('chat-messages');
        const emptyState = document.getElementById('empty-state');
        const logoutBtn = document.getElementById('logout-btn');
        const sendBtn = document.getElementById('send-btn');
        const loginError = document.getElementById('login-error');

        // 1. Authentifizierung starten (unsichtbar im Hintergrund)
        async function initAuth() {
            try {
                if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                    await signInWithCustomToken(auth, __initial_auth_token);
                } else {
                    await signInAnonymously(auth);
                }
            } catch (error) {
                console.error("Auth-Fehler:", error);
                showError("Verbindung fehlgeschlagen. Bitte Seite neu laden.");
                loadingScreen.classList.add('hidden');
            }
        }

        // Überwache den Auth-Status
        onAuthStateChanged(auth, (user) => {
            if (user) {
                currentUser = user;
                loadingScreen.classList.add('hidden');
                
                // Prüfen ob schon ein Name im SessionStorage ist
                const savedName = sessionStorage.getItem('chatUsername');
                if (savedName) {
                    startChat(savedName);
                } else {
                    loginScreen.classList.remove('hidden');
                    usernameInput.focus();
                }
            } else {
                currentUser = null;
                stopChat();
                loginScreen.classList.remove('hidden');
                chatScreen.classList.add('hidden');
            }
        });

        // App Start
        if (auth) {
            initAuth();
        }

        // 2. Namenswahl & Chat starten
        joinForm.addEventListener('submit', (e) => {
            e.preventDefault();
            const name = usernameInput.value.trim();
            if (name.length < 2) {
                loginError.textContent = "Der Name muss mindestens 2 Zeichen lang sein.";
                loginError.classList.remove('hidden');
                return;
            }
            if (!currentUser) {
                loginError.textContent = "Noch nicht verbunden, bitte kurz warten.";
                loginError.classList.remove('hidden');
                return;
            }
            
            loginError.classList.add('hidden');
            sessionStorage.setItem('chatUsername', name);
            startChat(name);
        });

        function startChat(name) {
            currentUsername = name;
            displayNameEl.textContent = name;
            
            loginScreen.classList.add('hidden');
            chatScreen.classList.remove('hidden');
            chatScreen.classList.add('flex');
            messageInput.focus();

            loadMessages();
        }

        function stopChat() {
            if (unsubscribeMessages) {
                unsubscribeMessages();
                unsubscribeMessages = null;
            }
            sessionStorage.removeItem('chatUsername');
            currentUsername = "";
        }

        logoutBtn.addEventListener('click', () => {
            stopChat();
            chatScreen.classList.add('hidden');
            chatScreen.classList.remove('flex');
            loginScreen.classList.remove('hidden');
            usernameInput.value = "";
            usernameInput.focus();
        });

        // 3. Nachrichten aus Firestore laden und anzeigen
        function loadMessages() {
            if (!currentUser || !db) return;

            // WIR NUTZEN HIER DEN FIXEN APP-ID STRING "gemeinsamer_chat_raum_12345"
            const messagesRef = collection(db, 'artifacts', appId, 'public', 'data', 'chat_messages');

            unsubscribeMessages = onSnapshot(messagesRef, (snapshot) => {
                const msgs = [];
                snapshot.forEach(doc => {
                    msgs.push({ id: doc.id, ...doc.data() });
                });

                // Nach Datum sortieren
                msgs.sort((a, b) => (a.timestamp || 0) - (b.timestamp || 0));
                
                renderMessages(msgs);
            }, (error) => {
                console.error("Fehler beim Laden der Nachrichten:", error);
            });
        }

        function renderMessages(messages) {
            chatMessages.innerHTML = '';
            
            if (messages.length === 0) {
                chatMessages.appendChild(emptyState);
                emptyState.classList.remove('hidden');
                return;
            } else {
                emptyState.classList.add('hidden');
            }

            let lastSenderId = null;

            messages.forEach((msg) => {
                const isOwnMessage = msg.userId === currentUser.uid;
                const showHeader = lastSenderId !== msg.userId;
                
                const msgWrapper = document.createElement('div');
                msgWrapper.className = `flex flex-col w-full message-enter ${isOwnMessage ? 'items-end' : 'items-start'}`;

                // Header
                if (showHeader) {
                    const header = document.createElement('span');
                    header.className = `text-xs font-semibold mb-1 mt-2 px-1 ${isOwnMessage ? 'text-indigo-600' : 'text-slate-500'}`;
                    header.textContent = isOwnMessage ? 'Du' : msg.sender;
                    msgWrapper.appendChild(header);
                } else {
                    msgWrapper.classList.add('-mt-2'); 
                }

                // Blase
                const bubble = document.createElement('div');
                bubble.className = `px-4 py-2.5 rounded-2xl max-w-[80%] break-words shadow-sm ${
                    isOwnMessage 
                    ? 'bg-indigo-600 text-white rounded-tr-none' 
                    : 'bg-white text-slate-800 rounded-tl-none border border-slate-100'
                }`;
                bubble.textContent = msg.text;

                if (msg.timestamp) {
                    const timeEl = document.createElement('span');
                    const date = new Date(msg.timestamp);
                    const timeStr = date.toLocaleTimeString('de-DE', { hour: '2-digit', minute: '2-digit' });
                    timeEl.className = `text-[10px] block mt-1 text-right ${isOwnMessage ? 'text-indigo-200' : 'text-slate-400'}`;
                    timeEl.textContent = timeStr;
                    bubble.appendChild(timeEl);
                }

                msgWrapper.appendChild(bubble);
                chatMessages.appendChild(msgWrapper);
                
                lastSenderId = msg.userId;
            });

            scrollToBottom();
        }

        function scrollToBottom() {
            setTimeout(() => {
                chatMessages.scrollTop = chatMessages.scrollHeight;
            }, 50);
        }

        // 4. Nachricht senden
        messageForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const text = messageInput.value.trim();
            
            if (!text || !currentUser || !db) return;

            messageInput.value = '';
            sendBtn.disabled = true;

            try {
                // WIR NUTZEN HIER DEN FIXEN APP-ID STRING "gemeinsamer_chat_raum_12345"
                const messagesRef = collection(db, 'artifacts', appId, 'public', 'data', 'chat_messages');
                await addDoc(messagesRef, {
                    text: text,
                    sender: currentUsername,
                    userId: currentUser.uid,
                    timestamp: Date.now() 
                });
            } catch (error) {
                console.error("Fehler beim Senden:", error);
            } finally {
                sendBtn.disabled = false;
                messageInput.focus();
            }
        });

        messageInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                messageForm.dispatchEvent(new Event('submit'));
            }
        });

        function showError(msg) {
            loginError.textContent = msg;
            loginError.classList.remove('hidden');
        }

    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Einfacher Chat</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style>
        body {
            background-color: #f3f4f6;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-between p-3 text-gray-800">

    <!-- Header -->
    <header class="text-center py-2">
        <h1 class="text-xl font-bold text-gray-700">Test-Chat</h1>
        <p class="text-gray-500 text-xs">Lokaler Test-Modus</p>
    </header>

    <!-- Chat-Bereich -->
    <main class="flex flex-col w-full max-w-md h-[75vh] bg-white rounded-2xl shadow-lg overflow-hidden my-auto border border-gray-200">
        
        <!-- Chat-Nachrichtenverlauf -->
        <div id="chat-messages" class="flex-1 p-4 overflow-y-auto flex flex-col gap-3">
            <div class="text-center text-gray-400 text-xs my-auto">Schreibe eine Testnachricht!</div>
        </div>

        <!-- Eingabebereich -->
        <form id="chat-form" class="p-3 bg-white border-t border-gray-200 flex gap-2 items-center">
            <input type="text" id="sender-input" placeholder="Name" class="w-1/3 px-3 py-2 text-xs bg-gray-50 border border-gray-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500" required>
            <input type="text" id="message-input" placeholder="Nachricht..." class="flex-1 px-3 py-2 text-xs bg-gray-50 border border-gray-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500" required>
            <button type="submit" class="bg-blue-600 hover:bg-blue-700 text-white font-bold p-2.5 rounded-xl shadow-md transition-all cursor-pointer">
                Senden
            </button>
        </form>
    </main>

    <!-- Footer -->
    <footer class="text-xs text-gray-400 py-1">
        Lokaler Chat
    </footer>

    <script>
        const chatMessages = document.getElementById('chat-messages');
        const chatForm = document.getElementById('chat-form');
        const senderInput = document.getElementById('sender-input');
        const messageInput = document.getElementById('message-input');

        // Nachrichten im lokalen Speicher des Browsers sichern, damit sie erhalten bleiben
        let messagesList = JSON.parse(localStorage.getItem('local_chat_msgs')) || [];

        function renderMessages() {
            chatMessages.innerHTML = '';
            if (messagesList.length === 0) {
                chatMessages.innerHTML = `<div class="text-center text-gray-400 text-xs my-auto">Noch keine Nachrichten da.</div>`;
                return;
            }

            messagesList.forEach((msg) => {
                const isMe = msg.sender.toLowerCase() === senderInput.value.toLowerCase() && senderInput.value.trim() !== "";
                
                const msgDiv = document.createElement('div');
                msgDiv.className = `flex flex-col ${isMe ? 'items-end' : 'items-start'} mb-1`;
                
                msgDiv.innerHTML = `
                    <span class="text-[10px] text-gray-400 px-1 mb-0.5">${escapeHtml(msg.sender)} • ${msg.time}</span>
                    <div class="max-w-[85%] px-3.5 py-2 rounded-2xl text-sm shadow-sm break-words ${isMe ? 'bg-blue-600 text-white' : 'bg-gray-100 text-gray-800'}">
                        ${escapeHtml(msg.text)}
                    </div>
                `;
                chatMessages.appendChild(msgDiv);
            });
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }

        chatForm.addEventListener('submit', (e) => {
            e.preventDefault();
            const sender = senderInput.value.trim();
            const text = messageInput.value.trim();

            if (!sender || !text) return;

            const time = new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
            messagesList.push({ sender, text, time });
            
            // Speichern
            localStorage.setItem('local_chat_msgs', JSON.stringify(messagesList));
            
            messageInput.value = '';
            renderMessages();
        });

        function escapeHtml(text) {
            const map = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' };
            return text.replace(/[&<>"']/g, function(m) { return map[m]; });
        }

        // Initiale Anzeige
        renderMessages();
    </script>
</body>
</html>
